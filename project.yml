name: CopyKat
options:
  bundleIdPrefix: dev.mixxamm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  CopyKat:
    type: application
    platform: macOS
    sources: [CopyKat]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: CopyKat/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: CopyKat
        CFBundleShortVersionString: "0.1.0"
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CopyKatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CopyKatTests]
    dependencies:
      - target: CopyKat
schemes:
  CopyKat:
    build:
      targets:
        CopyKat: all
    test:
      targets: [CopyKatTests]
