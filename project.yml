name: CopyCat
options:
  bundleIdPrefix: dev.mixxamm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  CopyCat:
    type: application
    platform: macOS
    sources: [CopyCat]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: CopyCat/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: CopyCat
        CFBundleShortVersionString: "0.1.0"
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  CopyCatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CopyCatTests]
    dependencies:
      - target: CopyCat
schemes:
  CopyCat:
    build:
      targets:
        CopyCat: all
    test:
      targets: [CopyCatTests]
