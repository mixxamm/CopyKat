name: CopyKat
options:
  bundleIdPrefix: com.mixxamm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  FuzzyMatch:
    url: https://github.com/ordo-one/FuzzyMatch.git
    exactVersion: 1.3.2

# Both apps ship the same sources; they differ only in sandboxing, updater and
# signing. Keep shared settings here so the two cannot drift apart.
targetTemplates:
  App:
    type: application
    platform: macOS
    sources:
      # Excluded, or Xcode copies them into the bundle as resources and Apple
      # rejects the package for containing a nested bundle.
      - path: CopyKat
        excludes:
          - "Info.plist"
          - "Info-MAS.plist"
          - "*.entitlements"
    dependencies:
      - package: KeyboardShortcuts
      - package: FuzzyMatch
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.mixxamm.copykat
        CODE_SIGN_STYLE: Automatic
        # A stable signing identity keeps the Accessibility permission valid
        # across rebuilds; ad-hoc signing invalidated it on every build.
        DEVELOPMENT_TEAM: 826KF5XR57
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  CopyKat:
    templates: [App]
    dependencies:
      - package: Sparkle
    info:
      path: CopyKat/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDisplayName: CopyKat
        # Resolved from build settings so the release workflow can set the
        # version from the git tag.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/mixxamm/CopyKat/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: "78x0TuiNj31++gwt6eWVa0YvcXMo7iKPLGY910CHnvk="

  # App Store build: sandboxed, updated by the App Store, so no Sparkle.
  CopyKat-MAS:
    templates: [App]
    settings:
      base:
        PRODUCT_NAME: CopyKat
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: MAS
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: CopyKat/CopyKat-MAS.entitlements
    info:
      path: CopyKat/Info-MAS.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDisplayName: CopyKat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false

  CopyKatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CopyKatTests]
    dependencies:
      - target: CopyKat

schemes:
  CopyKat:
    build:
      targets:
        CopyKat: all
    test:
      targets: [CopyKatTests]
  CopyKat-MAS:
    build:
      targets:
        CopyKat-MAS: all
