name: CopyKat
options:
  bundleIdPrefix: com.mixxamm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  FuzzyMatch:
    url: https://github.com/ordo-one/FuzzyMatch.git
    exactVersion: 1.3.2

# Both apps ship the same sources; they differ only in sandboxing, updater and
# signing. Keep shared settings here so the two cannot drift apart.
targetTemplates:
  App:
    type: application
    platform: macOS
    sources:
      # Excluded, or Xcode copies them into the bundle as resources and Apple
      # rejects the package for containing a nested bundle.
      - path: CopyKat
        excludes:
          - "Info.plist"
          - "Info-MAS.plist"
          - "*.entitlements"
    dependencies:
      - package: KeyboardShortcuts
      - package: FuzzyMatch
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.mixxamm.copykat
        CODE_SIGN_STYLE: Automatic
        # A stable signing identity keeps the Accessibility permission valid
        # across rebuilds; ad-hoc signing invalidated it on every build.
        DEVELOPMENT_TEAM: 826KF5XR57
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  CopyKat:
    templates: [App]
    dependencies:
      - package: Sparkle
    info:
      path: CopyKat/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDisplayName: CopyKat
        # Resolved from build settings so the release workflow can set the
        # version from the git tag.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/mixxamm/CopyKat/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: "78x0TuiNj31++gwt6eWVa0YvcXMo7iKPLGY910CHnvk="

  # App Store build: sandboxed, updated by the App Store, so no Sparkle.
  CopyKat-MAS:
    templates: [App]
    settings:
      base:
        PRODUCT_NAME: CopyKat
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: MAS
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: CopyKat/CopyKat-MAS.entitlements
    info:
      path: CopyKat/Info-MAS.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDisplayName: CopyKat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false

  CopyKatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CopyKatTests]
    dependencies:
      - target: CopyKat

  # The iPhone companion. Same bundle identifier as the Mac app, which is what
  # universal purchase requires. It shares the store and search core; capture
  # and paste are platform code of its own.
  CopyKat-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CopyKat/Store
      - path: CopyKat/Monitor/ClipboardCandidate.swift
      - path: CopyKat/Paste/SelfWriteTracker.swift
      - path: CopyKat/Settings/AppSettings.swift
      - path: CopyKat/Sync
      - path: CopyKat/Localizable.xcstrings
      - path: CopyKatiOS
        excludes:
          - "*.entitlements"
    dependencies:
      - package: FuzzyMatch
      - target: CopyKatShare
        embed: true
      - target: CopyKatKeyboard
        embed: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: CopyKat
        PRODUCT_BUNDLE_IDENTIFIER: com.mixxamm.copykat
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 826KF5XR57
        CODE_SIGN_ENTITLEMENTS: CopyKatiOS/CopyKat-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CopyKatiOS/Info.plist
      properties:
        CFBundleDisplayName: CopyKat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # Capture from the share sheet. Unlike the keyboard it may write to the app
  # group, so it funnels straight into the shared store.
  CopyKatShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CopyKatShare
      - path: CopyKat/Store
      - path: CopyKat/Monitor/ClipboardCandidate.swift
      - path: CopyKat/Paste/SelfWriteTracker.swift
      - path: CopyKat/Settings/AppSettings.swift
      - path: CopyKatiOS/KeyboardSnapshot.swift
    dependencies:
      - package: FuzzyMatch
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.mixxamm.copykat.share
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 826KF5XR57
        CODE_SIGN_ENTITLEMENTS: CopyKatShare/CopyKatShare.entitlements
        SKIP_INSTALL: YES
    info:
      path: CopyKatShare/Info.plist
      properties:
        CFBundleDisplayName: CopyKat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10

  # The picker keyboard. Reads the snapshot, inserts text, never asks for Full
  # Access; the store and the network stay out of reach on purpose.
  CopyKatKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CopyKatKeyboard
      - path: CopyKatiOS/KeyboardSnapshot.swift
      - path: CopyKatiOS/Brand.swift
      - path: CopyKat/Store/ClipboardItem.swift
      - path: CopyKat/Store/ImageStore.swift
      - path: CopyKat/Localizable.xcstrings
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.mixxamm.copykat.keyboard
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 826KF5XR57
        CODE_SIGN_ENTITLEMENTS: CopyKatKeyboard/CopyKatKeyboard.entitlements
        SKIP_INSTALL: YES
    info:
      path: CopyKatKeyboard/Info.plist
      properties:
        CFBundleDisplayName: CopyKat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: false

schemes:
  CopyKat:
    build:
      targets:
        CopyKat: all
    test:
      targets: [CopyKatTests]
  CopyKat-MAS:
    build:
      targets:
        CopyKat-MAS: all
  CopyKat-iOS:
    build:
      targets:
        CopyKat-iOS: all
