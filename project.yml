name: KopyKat
options:
  bundleIdPrefix: dev.mixxamm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  KopyKat:
    type: application
    platform: macOS
    sources: [KopyKat]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: KopyKat/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: KopyKat
        CFBundleShortVersionString: "0.1.0"
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  KopyKatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [KopyKatTests]
    dependencies:
      - target: KopyKat
schemes:
  KopyKat:
    build:
      targets:
        KopyKat: all
    test:
      targets: [KopyKatTests]
