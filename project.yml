name: CopyKat
options:
  bundleIdPrefix: dev.mixxamm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  Fuse:
    url: https://github.com/krisk/fuse-swift
    from: 1.4.0
targets:
  CopyKat:
    type: application
    platform: macOS
    sources: [CopyKat]
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - package: Fuse
    info:
      path: CopyKat/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: CopyKat
        # Resolved from build settings so the release workflow can set the
        # version from the git tag.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/mixxamm/CopyKat/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: "78x0TuiNj31++gwt6eWVa0YvcXMo7iKPLGY910CHnvk="
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "0.2.0"
        CODE_SIGN_STYLE: Automatic
        # A stable signing identity keeps the Accessibility permission valid
        # across rebuilds; ad-hoc signing invalidated it on every build.
        DEVELOPMENT_TEAM: 826KF5XR57
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CopyKatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CopyKatTests]
    dependencies:
      - target: CopyKat
schemes:
  CopyKat:
    build:
      targets:
        CopyKat: all
    test:
      targets: [CopyKatTests]
