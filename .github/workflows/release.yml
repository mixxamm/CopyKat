name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Build unsigned; the Sign step applies the Developer ID signature.
          xcodebuild -scheme CopyKat -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${TAG#v}" \
            CURRENT_PROJECT_VERSION="${TAG#v}" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
      - name: Sign
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk '{print $2}')
          codesign --force --deep --timestamp --options runtime \
            --sign "$IDENTITY" build/Build/Products/Release/CopyKat.app
          codesign --verify --strict build/Build/Products/Release/CopyKat.app
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Guard against stray whitespace pasted into the secrets.
          APPLE_ID="$(printf '%s' "$APPLE_ID" | tr -d '[:space:]')"
          APPLE_PASSWORD="$(printf '%s' "$APPLE_PASSWORD" | tr -d '[:space:]')"
          TEAM_ID="$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')"
          ditto -c -k --keepParent build/Build/Products/Release/CopyKat.app CopyKat.zip
          xcrun notarytool submit CopyKat.zip --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID"
          xcrun stapler staple build/Build/Products/Release/CopyKat.app
          ditto -c -k --keepParent build/Build/Products/Release/CopyKat.app CopyKat.zip
      - name: Generate Sparkle appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SPARKLE_KEY" ]; then
            echo "SPARKLE_ED_PRIVATE_KEY not set; skipping appcast generation"
            exit 0
          fi
          curl -L -o sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz
          mkdir sparkle-tools && tar -xf sparkle.tar.xz -C sparkle-tools
          mkdir updates && cp CopyKat.zip updates/
          printf '%s' "$SPARKLE_KEY" > ed_key
          ./sparkle-tools/bin/generate_appcast --ed-key-file ed_key \
            --download-url-prefix "https://github.com/mixxamm/CopyKat/releases/download/$TAG/" \
            -o appcast.xml updates
          rm ed_key
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CopyKat.zip
            appcast.xml
          generate_release_notes: true
